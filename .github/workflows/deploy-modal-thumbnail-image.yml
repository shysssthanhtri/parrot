name: Deploy Thumbnail Image to Modal

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "modal/**"
  #     - ".github/workflows/deploy-modal-thumbnail-image.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy speech thumbnail app
        run: modal deploy modal/speech_thumbnail.py
