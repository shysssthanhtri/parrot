name: Setup Modal Secrets

on:
  workflow_dispatch:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Sync cloudflare-r2 secret
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          modal secret create cloudflare-r2 \
            AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
            R2_BUCKET_NAME="$R2_BUCKET_NAME" \
            --force

      - name: Sync hf-token secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          modal secret create hf-token \
            HF_TOKEN="$HF_TOKEN" \
            --force

      - name: Sync chatterbox-api-key secret
        env:
          CHATTERBOX_API_KEY: ${{ secrets.CHATTERBOX_API_KEY }}
        run: |
          modal secret create chatterbox-api-key \
            CHATTERBOX_API_KEY="$CHATTERBOX_API_KEY" \
            --force
